name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            .pio/libdeps
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
      - run: pip install platformio
      # secrets.h is gitignored; the example is enough to compile.
      - run: cp lib/ConnectionManager/secrets.h.example lib/ConnectionManager/secrets.h
      - run: pio run -e arduino_nano_esp32
      - run: pio check --fail-on-defect=medium
