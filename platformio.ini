; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = arduino_nano_esp32

[env:arduino_nano_esp32]
platform = espressif32@6.12.0
board = arduino_nano_esp32
monitor_speed = 115200
framework = arduino
; upload_protocol = espota
upload_port = COM14
; upload_port = 10.102.193.162
build_flags =
	-Wall
	-Wextra
;	-DDEBUG_PID  ; uncomment for PID debug output on serial
	-DDEBUG_TICKS  ; uncomment to print signed encoder ticks per wheel (unit 0 = left, 1 = right)
; upload_flags = --auth=change-me  ; only if OTA_PASSWORD is set in secrets.h
lib_deps = 
	adafruit/Adafruit_VL53L0X@1.2.4
	links2004/WebSockets@2.7.3
; Static analysis: pio check   (only our code in src/ and lib/; third-party libraries are skipped)
check_tool = cppcheck
check_src_filters =
	+<src/>
	+<lib/>
	-<lib/ConnectionManager/secrets.h>
check_flags =
	cppcheck: --enable=warning,style,performance,portability --inline-suppr
	--suppress=preprocessorErrorDirective:*vl53l0x_types.h
check_severity = medium, high
check_skip_packages = yes

; Flash over WiFi: pio run -e ota -t upload
; Pass Gadget's address (or gadget.local) and, if OTA_PASSWORD is set in secrets.h, the password:
;   pio run -e ota -t upload --upload-port gadget.local
[env:ota]
extends = env:arduino_nano_esp32
upload_protocol = espota
upload_port = gadget.local
; upload_flags = --auth=change-me

; Host-side unit tests (hardware-free modules only, e.g. lib/Odometry): pio test -e native
; Needs a host C++ compiler (g++) on PATH; PlatformIO cannot install one on Windows.
[env:native]
platform = native
test_framework = unity
build_flags =
	-std=gnu++17
	-Wall
	-Wextra
	-Ilib/Steering
; Only Odometry is host-buildable; RobotGeometry.h is header-only and reached via -Ilib/Steering.
lib_ignore =
	Steering
	Commands
	ConnectionManager
	DistanceManager
